name: Publish WallFlip Gallery 2.0.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and install source files
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="wallflip-gallery.zip"
          INSTALLER="WallFlip_2.0.0_x64-setup.exe"
          test -f "$ARCHIVE"
          test -f "$INSTALLER"

          cp "$INSTALLER" "$RUNNER_TEMP/$INSTALLER"
          mkdir -p "$RUNNER_TEMP/wallflip-source"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/wallflip-source"

          SOURCE_ROOT="$(find "$RUNNER_TEMP/wallflip-source" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "$SOURCE_ROOT" ]; then
            echo "Expected the ZIP to contain a single project folder."
            exit 1
          fi

          FILE_COUNT="$(find "$SOURCE_ROOT" -type f | wc -l | tr -d ' ')"
          echo "Extracting $FILE_COUNT source files from $ARCHIVE"
          test "$FILE_COUNT" -ge 35

          cp -a "$SOURCE_ROOT/." .

          # Keep generated/downloadable binaries out of the source tree.
          rm -f "$ARCHIVE" "$INSTALLER"

          # Remove this one-use helper so no temporary workflow remains.
          rm -f .github/workflows/publish-release.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes detected."
          else
            git commit -m "Update WallFlip Gallery 2.0.0 source"
          fi

          git tag v2.0.0
          git push origin HEAD:main
          git push origin v2.0.0

      - name: Publish GitHub release with Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.0.0 "$RUNNER_TEMP/WallFlip_2.0.0_x64-setup.exe" \
            --title "WallFlip Gallery v2.0.0" \
            --notes "WallFlip Gallery 2.0.0 for Windows. Download the setup executable below to install the application."
