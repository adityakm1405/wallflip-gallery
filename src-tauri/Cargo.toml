[package]
name = "wallflip"
version = "2.0.0"
description = "Wallpaper gallery switcher: Alt+W opens an animated carousel of your wallpapers"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Thumbnails: only the decoders we need, parallelised on a small private pool.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif", "tiff"] }
rayon = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3        # image decoding/resizing dominates CPU time, so favour speed
lto = true
codegen-units = 1
panic = "abort"
strip = true

# decoders (png, zune-jpeg, flate2 ...) are separate crates: optimise all dependencies in `tauri dev`,
# otherwise decoding a 4K wallpaper takes seconds
[profile.dev.package."*"]
opt-level = 3

# generic resize/encode code from `image` is instantiated in this crate, so optimise it too
[profile.dev.package.wallflip]
opt-level = 3
